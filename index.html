<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VisionDetect Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" />
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <div class="logo">VisionDetect</div>
            <span id="statusIndicator" class="status-tag loading">Initializing</span>
        </header>

        <div class="main-layout">
            <main class="viewport-area">
                <div class="vision-frame" id="visionFrame">
                    <video id="video" autoplay muted playsinline class="hidden"></video>
                    <img id="staticDisplay" class="hidden" alt="Analysis Target">
                    <canvas id="canvas"></canvas>
                </div>
            </main>

            <aside class="ui-layer">
                
                <div class="telemetry-panel">
                    <div class="panel-section">
                        <h3 class="section-title">Live Telemetry</h3>
                        <div class="telemetry-box">
                            <ul id="objectList" class="data-list"><li class="placeholder-text">Scanning...</li></ul>
                        </div>
                    </div>
                    <div class="panel-section" id="desktopSummary">
                        <h3 class="section-title">Summary</h3>
                        <div class="telemetry-box">
                            <ul id="objectSummary" class="data-list"><li class="placeholder-text">—</li></ul>
                        </div>
                    </div>
                </div>

                <div class="controls-panel">
                    <div class="slider-section">
                        <div class="slider-header">
                            <label for="confidenceSlider">Confidence Threshold</label>
                            <span id="confidenceValue" class="accent-text">0.50</span>
                        </div>
                        <input type="range" id="confidenceSlider" min="0.1" max="0.95" step="0.05" value="0.50">
                    </div>

                    <div class="action-dock" id="actionGrid">
                        <div class="file-upload-wrapper hidden secondary-action" id="uploadWrapper">
                            <label for="imageUpload" class="btn btn-icon">
                                <span class="material-symbols-outlined">photo_library</span>
                            </label>
                            <input type="file" id="imageUpload" accept="image/*">
                        </div>

                        <button id="switchCamera" class="btn btn-icon secondary-action hidden">
                            <span class="material-symbols-outlined">cameraswitch</span>
                        </button>

                        <button id="startCamera" class="btn btn-primary hidden">
                            <span class="material-symbols-outlined">videocam</span>
                        </button>

                        <button id="stopCamera" class="btn btn-danger hidden">
                            <span class="material-symbols-outlined">stop</span>
                        </button>
                        
                        <button id="resetBtn" class="btn btn-danger hidden">
                            <span class="material-symbols-outlined">close</span>
                        </button>

                        <button id="downloadBtn" class="btn btn-icon secondary-action hidden">
                            <span class="material-symbols-outlined">download</span>
                        </button>
                    </div>
                </div>

            </aside>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
